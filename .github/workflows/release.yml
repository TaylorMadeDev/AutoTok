name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build portable app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AutoTok --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all PIL --collect-all moviepy --collect-all keyring --hidden-import=autotok app.py
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path dist\AutoTok\* -DestinationPath "AutoTok-Windows-x64-v$version.zip"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: AutoTok-Windows-x64-v*.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTok-Windows-x64
          path: AutoTok-Windows-x64-v*.zip
